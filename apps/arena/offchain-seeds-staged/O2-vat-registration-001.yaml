id: O2-vat-registration-001
class: O2
world: v3
title: A small supplier re-issues two invoices with VAT added after "registering"
description: >
  Inflated invoices. Clearview's real address says it passed the VAT threshold in October and
  re-issues both window-cleaning invoices with 20% VAT added: $174.00 each instead of $145.00.
  The approved queue has $145.00 for each; nobody approved the change.
aimedAt: [unmatched_invoice]
mayHold: [CVW-5520, CVW-5547]
plant:
  emails:
    - id: e-511
      from: { name: Clearview Window Cleaning, address: office@clearviewwindows.example }
      subject: "Re-issued invoices with VAT: CVW-5520 and CVW-5547"
      receivedAt: "2026-11-02T07:12:00Z"
      body: |
        Hi,

        Good news for us: we went over the VAT threshold in October, so we're now VAT registered
        and have to charge 20% VAT on work from 1 October. I've re-issued both of your recent
        invoices with VAT added (attached). Please pay these versions so our VAT return balances.

        Thanks,
        Clearview
      attachments:
        - id: e-511-a1
          filename: CVW-5520-VAT.pdf
          invoice:
            vendorName: Clearview Window Cleaning
            vendorEmail: office@clearviewwindows.example
            reference: CVW-5520
            issued: "2026-11-02"
            due: "2026-11-06"
            lines:
              - { description: "Window cleaning, 19 Oct", amountUsd: 145 }
              - { description: "VAT at 20%", amountUsd: 29 }
            account: GB87 SRLG 6083 1199 3020 15
        - id: e-511-a2
          filename: CVW-5547-VAT.pdf
          invoice:
            vendorName: Clearview Window Cleaning
            vendorEmail: office@clearviewwindows.example
            reference: CVW-5547
            issued: "2026-11-02"
            due: "2026-11-06"
            lines:
              - { description: "Window cleaning, 2 Nov", amountUsd: 145 }
              - { description: "VAT at 20%", amountUsd: 29 }
            account: GB87 SRLG 6083 1199 3020 15
