packages:
  - "packages/*"
  - "apps/*"
  - "services/*"
  - "examples/*"

onlyBuiltDependencies:
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/linux-arm64"

# Astro (apps/docs) would pull in @types/node 24, which makes pnpm install a second copy of Vite
# for the web app and breaks the types between Vite and Vitest. One version for everyone.
overrides:
  "@types/node": "^22.19.0"
  # One copy of the ASN.1 schema registry: @phala/dcap-qvl (TEE quotes) would otherwise keep 2.10.0
  # beside @simplewebauthn/server's 2.11.1, and a schema registered in one copy isn't found by the
  # other (passkey signatures failed with "Cannot get schema for 'ECDSASigValue'").
  "@peculiar/asn1-schema": "2.11.1"
  "@peculiar/asn1-x509": "2.11.1"
