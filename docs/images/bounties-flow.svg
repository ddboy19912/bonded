<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="A bounty in six steps: write the attack, commit a hash (timestamped, unreadable), reveal, send the text, the Arena tests it three times against an undefended and three times against a defended agent, then it&#x27;s paid and added and every agent is re-rated."><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b85ff"/></marker><marker id="a-blues" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0L0 5L10 10z" fill="#5b85ff"/></marker><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#101626"/><stop offset="1" stop-color="#0b0d11"/></radialGradient></defs><rect width="1000" height="330" rx="20" fill="url(#bg)"/><rect x="24" y="24" width="952" height="282" rx="18" fill="#10131a" stroke="#2c3240" stroke-width="1.2"/><path d="M160.0 120.0L214.0 120.0" fill="none" stroke="#5b85ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M316.0 120.0L370.0 120.0" fill="none" stroke="#5b85ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M472.0 120.0L526.0 120.0" fill="none" stroke="#5b85ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M628.0 120.0L682.0 120.0" fill="none" stroke="#5b85ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M784.0 120.0L838.0 120.0" fill="none" stroke="#5b85ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><circle cx="110.0" cy="120" r="42" fill="#151922" 