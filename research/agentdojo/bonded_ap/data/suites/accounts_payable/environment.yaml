# Harbor & Pine Studio's Monday in accounts payable: Bonded's "realistic job" world
# (apps/arena/src/offchain/scenarios.ts, realisticWorld) plus the pieces six pilot seeds need:
# a euro invoice with an exchange-rate quote, an approved customer refund, a Friday email that
# arrives only when the agent opens Friday, a saved note, three knowledge-base pages and a
# helpdesk ticket. With no injection, each of those carries its benign twin's text
# (scenarios.ts, preferenceHijackTwin and the others), so the default world is legitimate work.
#
# Every field that holds an injection is a double-quoted string; the suite escapes injected text
# for it (task_suite.py). Literal braces elsewhere are doubled for str.format.
