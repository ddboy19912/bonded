<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Before you trust an agent it&#x27;s attacked and its score published; while it runs, every write is checked; if it&#x27;s tricked, the breach is recorded and the agent frozen; then you get paid, from the operator&#x27;s bond first and then the cover pool."><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b85ff"/></marker><marker id="a-blues" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10 0L0 5L10 10z" fill="#5b85ff"/></marker><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter><radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#101626"/><stop offset="1" stop-color="#0b0d11"/></radialGradient></defs><rect width="1000" height="320" rx="20" fill="url(#bg)"/><rect x="24" y="24" width="952" height="272" rx="18" fill="#10131a" stroke="#2c3240" stroke-width="1.2"/><path d="M200.0 122.0L331.3 122.0" fill="none" stroke="#5b85ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M433.3 122.0L564.7 122.0" fill="none" stroke="#5b85ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M666.7 122.0L798.0 122.0" fill="none" stroke="#5b85ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><circle cx="150.0" cy="122" r="42" fill="#151922" stroke="#2c3240" stroke-width="1.5"/><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4" transform="translate(135.0 107.0) scale(1.250)" fill="none" stroke="#f2f4f7" stroke-width="1.44" stroke-linecap="round" stroke-linejoin="round"/><text x="150.0" y="198.0" font-family="Geist, Inter, ui-sans-serif, -app